name: FitStrive Server
on:
  push:
    branches:
      - main

jobs:
  Update-Server:
    runs-on: self-hosted
  
    steps:
      - name: Checkout server directory
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            server
          sparse-checkout-cone-mode: true
          
      - name: Deploy
        working-directory: server
        run: |
          npm ci
          npm run build
          npm run start
