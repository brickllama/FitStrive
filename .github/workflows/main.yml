name: FitStrive Server
on:
  push:
    branches:
      - main

jobs:
  Update-Server:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: server
        
    steps:
      - uses: actions/checkout@v6

      - name: Deploy
        run: |
          cd /home/fitstrive/server
          echo "Prepping server for deployment!"
          git pull origin main
          npm ci
          npm run build
          pm2 restart fitstrive-server
