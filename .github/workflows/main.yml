name: FitStrive Server
on:
  push:
    branches:
      - main

jobs:
  Update-Server:
    runs-on: self-hosted
  
    steps:
      - name: Checkout server directory
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            server
          sparse-checkout-cone-mode: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          tags: fitstrive/server:latest
          push: false
          load: true
      
      - name: Boot server
        run: |
          docker rm -f fitstrive-server || true
          docker run -d \
            --name fitstrive-server \
            --restart unless-stopped \
            -p 3000:3000 \
            fitstrive/server:latest
